name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only documentation changed?
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash tools/ci/needs-build.sh
      - name: Install SDL2
        if: steps.changes.outputs.build == 'true'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build
        if: steps.changes.outputs.build == 'true'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Core tests
        if: steps.changes.outputs.build == 'true'
        run: ctest --test-dir build --output-on-failure
      - name: Screenshot of the test pattern
        if: steps.changes.outputs.build == 'true'
        run: ./build/plumnin-headless --test-rom --frames 120 --png test-pattern.png --quiet
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.build == 'true'
        with:
          name: test-pattern-screenshot
          path: test-pattern.png

  # The emulator without a window: builds without SDL2 or OpenGL, as a CI job or a
  # Claude thread would to reproduce a bug, and keeps a run's outputs as an artifact.
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only documentation changed?
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash tools/ci/needs-build.sh
      - name: Build (no frontend)
        if: steps.changes.outputs.build == 'true'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPLUMNIN_BUILD_FRONTEND=OFF
          cmake --build build --parallel --target plumnin-headless core_tests
      - name: Headless tests
        if: steps.changes.outputs.build == 'true'
        run: ctest --test-dir build --output-on-failure -R "headless|core_tests"
      # The Game Boy's test ROMs (blargg, mooneye, the acid2 pictures): downloaded, never committed.
      - name: Game Boy test ROMs
        if: steps.changes.outputs.build == 'true'
        run: |
          curl -sSL -o gbtr.zip https://github.com/c-sp/game-boy-test-roms/releases/download/v7.0/game-boy-test-roms-v7.0.zip
          mkdir -p gbtr && unzip -q gbtr.zip -d gbtr
          cmake build -DGB_TEST_ROMS="$PWD/gbtr"
          cmake --build build --parallel --target gb-test-roms
          ctest --test-dir build --output-on-failure -R gb_test_roms
      # The NES's (blargg, sprite hit and overflow, MMC3...), at a fixed commit.
      - name: NES test ROMs
        if: steps.changes.outputs.build == 'true'
        run: |
          curl -sSL -o nestr.zip https://github.com/christopherpow/nes-test-roms/archive/95d8f621ae55cee0d09b91519a8989ae0e64753b.zip
          unzip -q nestr.zip && mv nes-test-roms-95d8f621ae55cee0d09b91519a8989ae0e64753b nestr
          cmake build -DNES_TEST_ROMS="$PWD/nestr"
          cmake --build build --parallel --target nes-test-roms
          ctest --test-dir build --output-on-failure -R nes_test_roms
      - name: Sample run with an input script
        if: steps.changes.outputs.build == 'true'
        run: |
          mkdir -p headless-out
          ./build/plumnin-headless --test-rom --frames 120 --out-dir headless-out \
            --do "30+30 right" --do "45 screenshot" --do "90 screenshot" --json headless-out/moves.json
          ./build/plumnin-headless --test-rom --system gb --frames 300 --png-every 100 --out-dir headless-out \
            --do "50-250 a" --wav headless-out/test-pattern.wav --hash-log headless-out/test-pattern-hashes.txt \
            --json headless-out/test-pattern.json
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.build == 'true'
        with:
          name: headless-output
          path: headless-out
